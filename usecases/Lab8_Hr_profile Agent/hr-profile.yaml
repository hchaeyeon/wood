openapi: 3.0.0
info:
  title: HR 프로필 API
  description: 인사 시스템의 직원 프로필 조회, 휴가 잔여 조회·신청, 직함·주소 변경 API
  version: 1.0.0
servers:
- url: "https://hr-profile-api.2hlcdi6kxra8.eu-de.codeengine.appdomain.cloud/"
  description: HR 프로필 API 서버
tags: []
paths:
  "/employees":
    get:
      summary: HRP_직원 검색
      operationId: search_employees
      description: |
        이름 또는 부서로 직원을 검색합니다. 이름 일부만 입력해도 됩니다. 둘 다 생략하면 전체 직원을 조회합니다.

        :param name: 이름 또는 이름 일부 (예: 민준), 또는 직원 번호
        :param department: 부서 또는 부서 일부 (예: 개발팀)
        :returns: 직원 목록
      parameters:
      - name: name
        in: query
        description: 이름 또는 이름 일부 (예 민준), 또는 직원 번호. 생략 시 전체.
        required: false
        schema:
          type: string
          title: 이름
      - name: department
        in: query
        description: 부서 또는 부서 일부 (예 개발팀). 생략 시 전체.
        required: false
        schema:
          type: string
          title: 부서
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Employee"
  "/employees/{employee}":
    get:
      summary: HRP_직원 프로필 조회
      operationId: get_employee_profile
      description: |
        직원 번호 또는 이름으로 직원 프로필(부서, 직함, 주소, 입사일, 휴가 정보)을 조회합니다.

        :param employee: 직원 번호(예: EMP_001) 또는 이름(예: 김민준)
        :returns: 직원 프로필
      parameters:
      - "$ref": "#/components/parameters/EmployeeKey"
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Employee"
        '404':
          description: 직원을 찾을 수 없음
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorDetail"
  "/employees/{employee}/time-off":
    get:
      summary: HRP_휴가 잔여 조회
      operationId: get_time_off_balance
      description: |
        직원의 잔여 휴가 일수와 신청해 둔 휴가 일수를 조회합니다.

        :param employee: 직원 번호(예: EMP_001) 또는 이름(예: 김민준)
        :returns: 잔여·신청 휴가 일수
      parameters:
      - "$ref": "#/components/parameters/EmployeeKey"
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TimeOffBalance"
        '404':
          description: 직원을 찾을 수 없음
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorDetail"
  "/time-off-requests":
    post:
      summary: HRP_휴가 신청
      operationId: request_time_off
      description: |
        직원의 휴가를 신청합니다. 휴가 일수는 시작일~종료일 사이의 평일 수입니다.
        잔여 휴가가 부족하거나 기간에 평일이 없으면 status 가 rejected 이고 message 에 사유가 있습니다.
        접수되면 status 가 submitted 이고 휴가 신청 번호(TO_yyyy_NNN)가 발급됩니다.

        :param employee: 직원 번호 또는 이름
        :param from_date: 시작일 (YYYY-MM-DD)
        :param to_date: 종료일 (YYYY-MM-DD)
        :param reason: 사유 (선택)
        :returns: 휴가 신청 처리 결과
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TimeOffRequestBody"
      responses:
        '200':
          description: 처리 결과 (접수 또는 반려)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TimeOffRequest"
        '404':
          description: 직원을 찾을 수 없음
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorDetail"
        '422':
          description: 날짜 형식 오류 또는 종료일이 시작일보다 빠름
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorDetail"
    get:
      summary: HRP_휴가 신청 내역 조회
      operationId: list_time_off_requests
      description: |
        접수된 휴가 신청 내역을 조회합니다. 직원을 생략하면 전체 내역을 조회합니다.

        :param employee: 직원 번호 또는 이름 (선택)
        :returns: 휴가 신청 목록
      parameters:
      - name: employee
        in: query
        description: 직원 번호(예 EMP_001) 또는 이름(예 김민준). 생략 시 전체.
        required: false
        schema:
          type: string
          title: 직원
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/TimeOffRequest"
  "/employees/{employee}/title":
    put:
      summary: HRP_직함 변경
      operationId: update_title
      description: |
        직원의 직함을 변경하고 변경된 프로필을 돌려줍니다.

        :param employee: 직원 번호 또는 이름
        :param new_title: 새 직함 (예: 과장)
        :returns: 변경된 직원 프로필
      parameters:
      - "$ref": "#/components/parameters/EmployeeKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateTitleBody"
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Employee"
        '404':
          description: 직원을 찾을 수 없음
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorDetail"
  "/employees/{employee}/address":
    put:
      summary: HRP_주소 변경
      operationId: update_address
      description: |
        직원의 주소를 변경하고 변경된 프로필을 돌려줍니다.

        :param employee: 직원 번호 또는 이름
        :param new_address: 새 주소
        :returns: 변경된 직원 프로필
      parameters:
      - "$ref": "#/components/parameters/EmployeeKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateAddressBody"
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Employee"
        '404':
          description: 직원을 찾을 수 없음
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorDetail"
  "/forms/employees":
    get:
      summary: HRP_직원 목록 조회(Form용)
      operationId: list_employees_for_form
      description: |
        Workflow Form 선택지로 쓸 직원 목록을 employees(=items) 필드로 감싸서 조회합니다.

        :param department: 부서 또는 부서 일부 (선택)
        :returns: 직원 목록(employees, items)
      parameters:
      - name: department
        in: query
        description: 부서 또는 부서 일부 (예 개발팀). 생략 시 전체.
        required: false
        schema:
          type: string
          title: 부서
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EmployeeList"
components:
  parameters:
    EmployeeKey:
      name: employee
      in: path
      description: 직원 번호(예 EMP_001) 또는 이름(예 김민준)
      required: true
      schema:
        type: string
        title: 직원
  schemas:
    Employee:
      type: object
      properties:
        employee_id:
          type: string
          description: "직원 번호 (예: EMP_001)"
        name:
          type: string
          description: 이름
        department:
          type: string
          description: 부서
        title:
          type: string
          description: 직함
        address:
          type: string
          description: 주소
        hire_date:
          type: string
          format: date
          description: 입사일 (YYYY-MM-DD)
        time_off_balance:
          type: number
          description: 잔여 휴가 일수
        requested_time_off:
          type: number
          description: 신청해 둔 휴가 일수
      required: [employee_id, name, department, title, address, hire_date, time_off_balance, requested_time_off]
      title: Employee
    EmployeeList:
      type: object
      properties:
        employees:
          type: array
          items:
            "$ref": "#/components/schemas/Employee"
          description: Workflow Form 원본 변수로 선택할 직원 목록
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Employee"
          description: 직원 목록
      required: [items, employees]
      title: EmployeeList
    TimeOffBalance:
      type: object
      properties:
        employee_id:
          type: string
          description: 직원 번호
        name:
          type: string
          description: 이름
        time_off_balance:
          type: number
          description: 잔여 휴가 일수
        requested_time_off:
          type: number
          description: 신청해 둔 휴가 일수
      required: [employee_id, name, time_off_balance, requested_time_off]
      title: TimeOffBalance
    TimeOffRequestBody:
      type: object
      properties:
        employee:
          type: string
          description: 직원 번호(예 EMP_001) 또는 이름(예 김민준)
        from_date:
          type: string
          format: date
          description: 시작일 (YYYY-MM-DD)
        to_date:
          type: string
          format: date
          description: 종료일 (YYYY-MM-DD)
        reason:
          type: string
          description: 사유 (선택)
      required: [employee, from_date, to_date]
      title: TimeOffRequestBody
    TimeOffRequest:
      type: object
      properties:
        request_id:
          type: string
          nullable: true
          description: "휴가 신청 번호 (접수된 경우, 예: TO_2026_001). 반려되면 null"
        employee_id:
          type: string
          description: 직원 번호
        name:
          type: string
          description: 이름
        from_date:
          type: string
          format: date
          description: 시작일
        to_date:
          type: string
          format: date
          description: 종료일
        days:
          type: number
          description: 휴가 일수 (주말 제외 평일 수)
        reason:
          type: string
          description: 사유
        status:
          type: string
          enum: [submitted, rejected]
          description: 처리 결과 (submitted=접수, rejected=반려)
        message:
          type: string
          description: 처리 결과 안내 (반려 사유 포함)
        time_off_balance:
          type: number
          description: 처리 후 잔여 휴가 일수
      required: [employee_id, name, from_date, to_date, days, status, message, time_off_balance]
      title: TimeOffRequest
    UpdateTitleBody:
      type: object
      properties:
        new_title:
          type: string
          description: "새 직함 (예: 과장)"
      required: [new_title]
      title: UpdateTitleBody
    UpdateAddressBody:
      type: object
      properties:
        new_address:
          type: string
          description: 새 주소
      required: [new_address]
      title: UpdateAddressBody
    ErrorDetail:
      type: object
      properties:
        detail:
          description: 오류 내용
      title: ErrorDetail
